<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 5 - Change Image Source</title>
</head>
<body>
  <img id="myImage" src="image1.jpg" alt="My Image" width="300">

  <script>
    // 1. Select the image using its ID
    const img = document.getElementById("myImage");

    // 2. Change the src attribute
    img.src = "image2.jpg";
    // (equivalent: img.setAttribute("src", "image2.jpg");)
  </script>
</body>
</html>
