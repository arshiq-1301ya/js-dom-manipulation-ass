<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2 - Replace Text with Bold HTML</title>
</head>
<body>
  <p id="info">This is a normal text.</p>

  <script>
    // 1. Select the paragraph with id="info"
    const info = document.getElementById("info");

    // 2. Replace its content with bold HTML
    info.innerHTML = "<b>This is bold text now!</b>";
  </script>
</body>
</html>
