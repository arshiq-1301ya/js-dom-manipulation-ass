<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 1 - Change Text and Style</title>
</head>
<body>
  <h1 id="heading">Hello</h1>
  <p id="para">This is a paragraph.</p>

  <script>
    // 1. Change the text of the <h1>
    document.getElementById("heading").innerText = "Welcome to DOM!";

    // 2. Change the text color of the <p> to green
    document.getElementById("para").style.color = "green";
  </script>
</body>
</html>
